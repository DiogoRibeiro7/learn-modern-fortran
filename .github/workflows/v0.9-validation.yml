name: v0.9 Validation

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v0_9_fpm_test:
    name: v0.9 FPM test batch
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - name: vector-ops
            path: examples/vector-ops
          - name: monte-carlo-pi
            path: projects/monte-carlo-pi
          - name: ode-solver
            path: projects/ode-solver
          - name: matrix-toolkit
            path: projects/matrix-toolkit
          - name: file-processing
            path: examples/file-processing

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Fortran compiler
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: latest

      - name: Set up fpm
        uses: fortran-lang/setup-fpm@v7

      - name: Run fpm test
        working-directory: ${{ matrix.package.path }}
        run: fpm test
