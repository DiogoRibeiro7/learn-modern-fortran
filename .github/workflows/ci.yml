name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        package:
          - name: hello
            path: examples/hello
          - name: basics
            path: examples/basics
          - name: matrix-basics
            path: examples/matrix-basics

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Fortran compiler
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: latest

      - name: Set up fpm
        uses: fortran-lang/setup-fpm@v7

      - name: Build package
        working-directory: ${{ matrix.package.path }}
        run: fpm build

  test:
    name: Test ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        package:
          - name: arrays-procedures
            path: examples/arrays-procedures
          - name: statistics
            path: examples/statistics
          - name: modules-types
            path: examples/modules-types
          - name: vector-ops
            path: examples/vector-ops
          - name: file-processing
            path: examples/file-processing
          - name: parallel-matrix
            path: examples/parallel-matrix
          - name: monte-carlo-pi
            path: projects/monte-carlo-pi
          - name: ode-solver
            path: projects/ode-solver
          - name: matrix-toolkit
            path: projects/matrix-toolkit
          - name: heat-diffusion
            path: projects/heat-diffusion

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Fortran compiler
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: latest

      - name: Set up fpm
        uses: fortran-lang/setup-fpm@v7

      - name: Run package tests
        working-directory: ${{ matrix.package.path }}
        run: fpm test
